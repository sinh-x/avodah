name: avodah_viewer
description: Read-only daily plan viewer for Avodah
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  http: ^1.2.0
  flutter_markdown: ^0.7.0
  flutter_pdfview: ^1.4.4
  image_picker: ^1.0.7
  url_launcher: ^6.2.0
  photo_view: ^0.15.0

  # Local Database (Drift - SQLite)
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # Shared core (CRDT, storage, documents)
  avodah_core:
    path: ../packages/avodah_core
  highlight: ^0.7.0

  # Secure sync (Phase 4 - AVO-065)
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.2

dependency_overrides:
  # 2.3.0 pulls in jni/jni_flutter which requires NDK 28 (not available in Nix env)
  path_provider_android: 2.2.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
