services:
  avodah-sync:
    build:
      context: .
      dockerfile: Dockerfile
    network_mode: host
    volumes:
      # Config dir (read-write — config.json is mutated by chip save API)
      - ${AVODAH_CONFIG:-~/.config/avodah}:/config
      # Data dir (read-write — SQLite database)
      - ${AVODAH_DATA:-~/.local/share/avodah}:/data
    environment:
      - AVODAH_DATA_DIR=/data
      - AVODAH_CONFIG_DIR=/config
      - SYNC_PORT=${SYNC_PORT:-9847}
      - JIRA_ENABLED=${JIRA_ENABLED:-false}
      # Agent API URL — proxied to pa serve (same host, port 9848)
      - AGENT_API_URL=http://localhost:${AGENT_PORT:-9848}
    restart: unless-stopped

  avodah-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    network_mode: host
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      # Mount Caddyfile from repo (avoids rebuilding image for config changes)
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      - WEB_PORT=${WEB_PORT:-8080}
      - SYNC_SERVER_HOST=localhost
      - SYNC_SERVER_PORT=${SYNC_PORT:-9847}
      - AGENT_API_HOST=localhost
      - AGENT_API_PORT=${AGENT_PORT:-9848}
    depends_on:
      - avodah-sync
    restart: unless-stopped
